<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="soloface 在 GitHub 上星标的仓库索引：按功能分类、语言和主题筛选。">
<title>星标索引 · GitHub Stars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23c98a0b' d='M8 .8l2.2 4.5 4.9.7-3.6 3.5.9 4.9L8 12.1l-4.4 2.3.9-4.9L.9 6l4.9-.7z'/%3E%3C/svg%3E">
<!-- bump ?v= on every release that changes css/js -->
<link rel="stylesheet" href="css/style.css?v=20261009">
</head>
<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 16 16"><path fill="currentColor" d="M8 .8l2.2 4.5 4.9.7-3.6 3.5.9 4.9L8 12.1l-4.4 2.3.9-4.9L.9 6l4.9-.7z"/></symbol>
  <symbol id="i-fork" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4.5 4.5v1.2c0 1.2.9 2 2 2h3c1.1 0 2-.8 2-2V4.5M8 7.7v3.8"/><circle cx="4.5" cy="3" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="3" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="13" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.6 10.6l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9L13 13M3 13l1.1-1.1M11.9 4.1L13 3"/></symbol>
  <symbol id="i-gh" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.5.8.5 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 16 8c0-4.4-3.6-8-8-8z"/></symbol>
  <symbol id="i-sync" viewBox="0 0 16 16"><path d="M13.5 6.5A5.6 5.6 0 0 0 3.2 4.6M2.5 9.5a5.6 5.6 0 0 0 10.3 1.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3 1.8v3h3M13 14.2v-3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-filter" viewBox="0 0 16 16"><path d="M2 4h12M4.5 8h7M7 12h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg width="15" height="15"><use href="#i-star"/></svg></span>
        <div>
          <h1>星标索引</h1>
          <div class="brand-sub" id="brandSub">载入中…</div>
        </div>
      </div>
      <button class="filter-btn m-only" type="button" data-act="open-sheet" aria-haspopup="dialog" aria-controls="facets" aria-expanded="false">
        <svg width="14" height="14" aria-hidden="true"><use href="#i-filter"/></svg>筛选<span class="badge num" id="filterBadge" hidden></span>
      </button>
      <button class="icon-btn m-only js-theme" type="button" data-act="theme"></button>
      <div class="search">
        <label for="q" class="sr">搜索仓库名称、描述、主题或分类</label>
        <svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="搜索名称、描述、分类" autocomplete="off" spellcheck="false">
        <span class="kbd" aria-hidden="true">/</span>
      </div>
    </div>
    <div class="scrim" data-act="close-sheet"></div>
    <div class="facets" id="facets" role="region" aria-label="筛选与排序"></div>
    <div class="side-foot">
      <button class="icon-btn js-theme" type="button" data-act="theme"></button>
      <a class="icon-btn" href="https://github.com/soloface?tab=stars" target="_blank" rel="noopener" aria-label="在 GitHub 上查看全部星标" title="在 GitHub 上查看全部星标"><svg width="16" height="16" aria-hidden="true"><use href="#i-gh"/></svg></a>
      <a class="icon-btn" href="https://github.com/soloface/github-stars-dashboard/actions/workflows/fetch-stars.yml" target="_blank" rel="noopener" aria-label="手动同步：在 GitHub Actions 中运行同步（仅仓库所有者）" title="手动同步：打开 GitHub Actions，点 Run workflow（仅仓库所有者可用）"><svg width="16" height="16" aria-hidden="true"><use href="#i-sync"/></svg></a>
      <span class="foot-meta" id="updated"></span>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="filterbar">
      <div class="fstate" id="filterState"></div>
      <button class="switch" id="groupToggle" type="button" data-act="group" aria-pressed="false" hidden>
        <span class="track" aria-hidden="true"></span>按分类分组
      </button>
    </div>
    <p class="sr" id="liveCount" aria-live="polite"></p>
    <div class="cols" id="cols" role="group" aria-label="列标题与排序"></div>
    <div id="results"></div>
  </main>
</div>

<script src="js/logic.js?v=20261009" defer></script>
<script src="js/app.js?v=20261009" defer></script>
</body>
</html>
